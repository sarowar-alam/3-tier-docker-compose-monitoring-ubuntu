name: Deploy Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Images and Deploy
    runs-on: self-hosted
    
    steps:
      - name: Ensure docker group membership
        run: |
          echo "=== Docker Group Check ==="
          echo "Current user: $(whoami)"
          echo "Current groups: $(groups)"

          if ! groups ubuntu | grep -q docker; then
            echo "Adding ubuntu to docker group..."
            sudo usermod -aG docker ubuntu
          else
            echo "OK: ubuntu is already in docker group"
          fi

          echo "Verifying docker access..."
          docker ps > /dev/null 2>&1 && echo "OK: Docker is accessible" || echo "WARNING: Docker not yet accessible (runner may need restart)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest code
        run: |
          cd /home/ubuntu/3-tier-docker-compose-monitoring-ubuntu
          git fetch origin main
          git reset --hard origin/main
          git pull origin main

      - name: Build application images
        run: |
          set -e
          cd /home/ubuntu/3-tier-docker-compose-monitoring-ubuntu
          echo "Building Phase 1 application images..."
          docker compose -f docker-compose.yml build --no-cache
          
      - name: Deploy application with monitoring
        run: |
          set -e
          cd /home/ubuntu/3-tier-docker-compose-monitoring-ubuntu

          echo "Ensuring postgres is running..."
          docker compose -f docker-compose.yml up -d postgres

          echo "Waiting for postgres to be healthy..."
          for i in $(seq 1 12); do
            if docker compose -f docker-compose.yml exec -T postgres pg_isready -U bmi_user -d bmidb > /dev/null 2>&1; then
              echo "Postgres is healthy"
              break
            fi
            echo "Waiting for postgres... attempt $i/12"
            sleep 5
          done

          echo "Deploying application containers (Phase 1)..."
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d --force-recreate --no-deps backend frontend

          echo "Ensuring monitoring stack is running (Phase 2)..."
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d prometheus grafana loki promtail cadvisor node-exporter

          echo "Waiting for services to stabilize..."
          sleep 15

      - name: Health check
        run: |
          cd /home/ubuntu/3-tier-docker-compose-monitoring-ubuntu
          
          echo "Checking backend health..."
          if docker compose exec -T frontend curl -f http://backend:3000/health > /dev/null 2>&1; then
            echo "OK: Backend is healthy"
          else
            echo "FAIL: Backend health check failed"
            exit 1
          fi
          
          echo "Checking frontend..."
          if curl -f http://localhost > /dev/null 2>&1; then
            echo "OK: Frontend is accessible"
          else
            echo "FAIL: Frontend is not accessible"
            exit 1
          fi
          
          echo "Checking Grafana..."
          if curl -f http://localhost:3001 > /dev/null 2>&1; then
            echo "OK: Grafana is accessible"
          else
            echo "WARNING: Grafana check failed (may still be starting)"
          fi
          
          echo "Checking Prometheus..."
          if curl -f http://localhost:9090/-/healthy > /dev/null 2>&1; then
            echo "OK: Prometheus is healthy"
          else
            echo "WARNING: Prometheus check failed"
          fi

      - name: Show container status
        run: |
          cd /home/ubuntu/3-tier-docker-compose-monitoring-ubuntu
          echo "=== All Container Status ==="
          docker compose -f docker-compose.yml -f docker-compose.monitoring.yml ps

      - name: Cleanup old images
        run: docker image prune -af --filter "until=24h"

      - name: Deployment summary
        run: |
          PUBLIC_IP=$(curl -s http://169.254.169.254/latest/meta-data/public-ipv4)
          echo "=========================================="
          echo "Deployment completed successfully!"
          echo "=========================================="
          echo "Phase 1 - Application:"
          echo "  Frontend: http://${PUBLIC_IP}"
          echo "  Backend API: http://${PUBLIC_IP}:3000 (internal)"
          echo ""
          echo "Phase 2 - Monitoring:"
          echo "  Grafana: http://${PUBLIC_IP}:3001"
          echo "  Prometheus: http://${PUBLIC_IP}:9090"
          echo ""
          echo "Total Containers: 9 (3 app + 6 monitoring)"
          echo "=========================================="


